# Builds SimpleBrowser on every push and pull request, and publishes a release
# for every version tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# builds the universal app, packages SimpleBrowser-0.2.0.dmg, signs it for the
# in-app updater with the UPDATE_SIGNING_KEY secret, and creates the GitHub
# Release the app's "Check for Updates" reads. Other builds upload the DMG as
# a workflow artifact only.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Package.swift needs Swift 6 and the macOS 15.4 SDK: take the newest
      # Xcode the runner has rather than whatever is the default this month.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"
          swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::Tag v$version is not a release version (like v1.2.3)"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: swift build

      - name: Checks
        run: |
          swift run BrowserKitChecks
          swift run BlockKitChecks
          swift run DataKitChecks
          swift run PasswordKitChecks
          swift run TranslateKitChecks
          swift run UpdateKitChecks

      - name: Unit tests
        run: swift test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          # Only a tag build may sign: the updater installs anything this key signs.
          UPDATE_SIGNING_KEY: ${{ steps.version.outputs.release == 'true' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          if [ "${{ steps.version.outputs.release }}" = "true" ] && [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set: a release without a signature cannot be installed by the in-app updater"
            exit 1
          fi
          ./scripts/make-dmg.sh

      - name: Check the update signature
        if: steps.version.outputs.release == 'true'
        run: test -s "dist/SimpleBrowser-${{ steps.version.outputs.version }}.dmg.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            dist/*.dmg
            dist/*.dmg.sig
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/*.dmg dist/*.dmg.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "SimpleBrowser ${TAG#v}" \
            --generate-notes
