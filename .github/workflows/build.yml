# Builds Keel on every push and pull request, and publishes a release
# for every version tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# builds the universal app, signs it with the Developer ID, notarizes and
# staples the app and Keel-0.2.0.dmg, signs the DMG for the in-app
# updater with the UPDATE_SIGNING_KEY secret, and creates the GitHub Release
# the app's "Check for Updates" reads. Other builds upload the DMG as a
# workflow artifact only.
#
# Secrets for a release that opens with no Gatekeeper warning:
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate and
#                              its private key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password it was exported with
#   NOTARY_KEY                 an App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID              its key ID
#   NOTARY_ISSUER              its issuer ID
# Without them a tag build still releases, ad-hoc signed, with a warning in
# the run (Gatekeeper warns on first launch). Set the repository variable
# REQUIRE_NOTARIZED_RELEASE to "true" to have such a build fail instead.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Package.swift needs Swift 6 and the macOS 15.4 SDK: take the newest
      # Xcode the runner has rather than whatever is the default this month.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"
          swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::Tag v$version is not a release version (like v1.2.3)"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: swift build

      - name: Checks
        run: |
          swift run BrowserKitChecks
          swift run BlockKitChecks
          swift run DataKitChecks
          swift run PasswordKitChecks
          swift run TranslateKitChecks
          swift run UpdateKitChecks

      - name: Unit tests
        run: swift test

      # A keychain of its own for the run, with the Developer ID in it; gone with the runner.
      - name: Import the Developer ID
        if: steps.version.outputs.release == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          REQUIRE_NOTARIZED: ${{ vars.REQUIRE_NOTARIZED_RELEASE }}
        run: |
          if [ -z "$P12" ] || [ -z "$NOTARY_KEY_BASE64" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            if [ "$REQUIRE_NOTARIZED" = "true" ]; then
              echo "::error::A notarized release needs DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD, NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER (see the top of this file)"
              exit 1
            fi
            echo "::warning::No Developer ID or notary key: this release is ad-hoc signed, and Gatekeeper will warn on first launch. Add the secrets named at the top of build.yml for a notarized release."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application identity"; exit 1; fi
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          # Only a tag build may sign: the updater installs anything this key signs.
          UPDATE_SIGNING_KEY: ${{ steps.version.outputs.release == 'true' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          if [ "${{ steps.version.outputs.release }}" = "true" ] && [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set: a release without a signature cannot be installed by the in-app updater"
            exit 1
          fi
          ./scripts/make-dmg.sh

      - name: Check the update signature
        if: steps.version.outputs.release == 'true'
        run: test -s "dist/Keel-${{ steps.version.outputs.version }}.dmg.sig"

      # As a downloaded copy will be judged: Gatekeeper, from the stapled ticket.
      - name: Check Gatekeeper
        if: steps.version.outputs.release == 'true' && env.NOTARY_KEY != ''
        run: |
          dmg="dist/Keel-${{ steps.version.outputs.version }}.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          spctl --assess --type execute --verbose dist/Keel.app

      - uses: actions/upload-artifact@v4
        with:
          name: Keel-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            dist/*.dmg
            dist/*.dmg.sig
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/*.dmg dist/*.dmg.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "Keel ${TAG#v}" \
            --generate-notes
