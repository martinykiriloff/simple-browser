<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dashboard — Acme Admin</title>
<style>body { font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 720px; padding: 16px; } .badge { padding: 2px 8px; border-radius: 10px; background: #eee; }</style></head>
<body>
<header><strong>Acme Admin</strong> <nav aria-label="Main"><a href="/admin/">Admin</a> <a href="#">Help</a></nav></header>
<h1>Dashboard</h1>
<p>Session: <span id="session" class="badge">checking…</span></p>
<button id="signin">Sign in</button>
<script>
// Signing in sets `session` with Path=/admin, but this page lives at / and
// reads document.cookie, so it never sees the session it just got.
async function signIn() {
  await fetch('/admin/login', { credentials: 'same-origin' });
  check();
}
function check() {
  const signedIn = document.cookie.split('; ').some(c => c.startsWith('session='));
  document.getElementById('session').textContent = signedIn ? 'signed in' : 'not signed in';
}
document.getElementById('signin').addEventListener('click', signIn);
signIn();
</script>
</body></html>
