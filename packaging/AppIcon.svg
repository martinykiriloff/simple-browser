<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Keel</title>
  <!-- The browser while an agent drives it: dark chrome, the agent's tab
       marked amber, and the amber edge Keel draws along that tab's page. -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="page"><rect x="196" y="340" width="632" height="660" rx="44"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B0D11"/>
  <g clip-path="url(#tile)">
    <!-- Tabs: the person's, then the agent's -->
    <rect x="196" y="236" width="196" height="64" rx="20" fill="#262C36"/>
    <rect x="412" y="236" width="244" height="64" rx="20" fill="#171B22"/>
    <rect x="412" y="282" width="244" height="18" fill="#F2A93B"/>
    <rect x="436" y="256" width="24" height="24" rx="6" fill="#F2A93B"/>
    <!-- The page, with the agent edge along its top -->
    <rect x="196" y="340" width="632" height="660" rx="44" fill="#FFFFFF"/>
    <rect x="196" y="340" width="632" height="30" fill="#F2A93B" clip-path="url(#page)"/>
    <rect x="276" y="440" width="300" height="34" rx="17" fill="#D7DAE0"/>
    <rect x="276" y="510" width="420" height="34" rx="17" fill="#EDEFF2"/>
    <rect x="276" y="640" width="320" height="104" rx="22" fill="#1B1D21"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#2A303B" stroke-width="3"/>
</svg>
